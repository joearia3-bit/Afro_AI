<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afro AI - Made for All</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">
<div class="sidebar" id="sidebar">
<h2>Afro AI</h2>
<button onclick="newChat()">+ New Chat</button>
<p style="font-size:12px;margin-top:20px;opacity:0.7">Made for all 🌍</p>
</div>
<div class="main">
<div class="topbar">
<button onclick="toggleSidebar()">☰</button>
<span>Afro AI - Made for All</span>
<button onclick="toggleTheme()">🌙</button>
</div>
<div id="chatArea" class="chatArea">
<div class="welcome">
<div class="welcome-logo">A</div>
<h1>Welcome to Afro AI</h1>
<p>What would you like to ask today? Built for all.</p>
</div>
</div>
<div class="inputArea">
<input id="messageInput" placeholder="Message Afro AI..." onkeydown="handleKey(event)">
<button onclick="sendMessage()">↑</button>
</div>
</div>
</div>
<script src="script.js?v=2"></script>
</body>
</html>
