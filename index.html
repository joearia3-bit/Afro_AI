<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI for All - Created by Joseph Aria in PNG</title><style>body{font-family:system-ui;margin:0;background:#f7f5ff}header{padding:14px;background:white;box-shadow:0 2px 8px #0001;position:sticky;top:0}.top{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:18px}.sub{font-size:12px;color:#666}.btn{border:0;border-radius:20px;padding:8px 14px;font-weight:700}#simpleBtn{background:#6d28d9;color:white}#chat{padding:12px;padding-bottom:100px;max-width:700px;margin:auto}.msg{display:flex;gap:10px;margin:12px 0}.badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:800}.J{background:#111}.A{background:#9333ea}.bubble{background:white;padding:13px;border-radius:16px;box-shadow:0 2px 8px #0001;line-height:1.6;flex:1;white-space:pre-wrap}.speakBtn{margin-top:10px;background:#f3e8ff;border:0;padding:7px 14px;border-radius:20px;font-weight:700;color:#6d28d9}#bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:8px;box-shadow:0 -2px 12px #0001}#input{flex:1;border:1px solid #ddd;border-radius:24px;padding:13px 16px}#send{background:black;color:white;border:0;width:46px;height:46px;border-radius:50%}footer{text-align:center;padding:20px;color:#777;font-size:12px}</style></head><body><header><div class="top"><div><h1>Afro AI — Made for All</h1><div class="sub">Afro AI for all. Created by Joseph Aria in PNG 🇵🇬</div></div><div style="display:flex;gap:8px"><button id="simpleBtn" class="btn">🧒 Simple: ON</button><button onclick="clearChat()" class="btn" style="background:#eee">🗑️ Clear</button></div></div></header><div id="chat"></div><div id="bar"><input id="input" placeholder="Ask me..."><button id="send">↑</button><button id="micBtn" style="border:1px solid #ddd;background:white;width:46px;height:46px;border-radius:50%">🎤</button></div><footer><b>Afro AI for All</b><br>Created by Joseph Aria in PNG 🇵🇬 — 2026<br>Made for pikinini and everyone ❤️<br>Simple words + Voice 🔊</footer><script>
const chat=document.getElementById('chat'),input=document.getElementById('input');let simple=true;
document.getElementById('simpleBtn').onclick=()=>{simple=!simple;document.getElementById('simpleBtn').textContent=simple?'🧒 Simple: ON':'🧒 Simple: OFF';};
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let c=t.replace(/[^\w\s.,!?']/g,' ').slice(0,450);let u=new SpeechSynthesisUtterance(c);u.rate=0.9;u.lang='en-AU';speechSynthesis.speak(u);}
function addMsg(r,t){const d=document.createElement('div');d.className='msg';const b=document.createElement('div');b.className='badge '+(r==='J'?'J':'A');b.textContent=r==='J'?'YOU':'AI';const bu=document.createElement('div');bu.className='bubble';bu.textContent=t;if(r==='A'){const btn=document.createElement('button');btn.className='speakBtn';btn.textContent='🔊 Read Aloud';btn.onclick=()=>speak(t);bu.appendChild(document.createElement('br'));bu.appendChild(btn);setTimeout(()=>speak(t),700);}d.appendChild(b);d.appendChild(bu);chat.appendChild(d);window.scrollTo(0,document.body.scrollHeight);}
function getAnswer(q){let l=q.toLowerCase();if(l.includes('internet'))return"Internet is like giant web of wires 🌐\nLike big river carrying messages between villages 🏠🛶\nYou see friends in Sydney, songs from Port Moresby 🎧\nFast like letter 📬⚡ Great question! 🌟";if(l.includes('phone'))return"Phone is small magic box 📱✨\nTalk to wantok in Lae even from village 🗣️\nSee face, send photo 📸 Good job! 🌟";return"Good question! 🌟\n"+q+" is like village tool 🛠️ Helps work faster. You are smart! Keep asking! 💪🌟";}
document.getElementById('send').onclick=()=>{if(!input.value.trim())return;let q=input.value;addMsg('J',q);input.value='';setTimeout(()=>addMsg('A',getAnswer(q)),400);};input.onkeydown=e=>{if(e.key==='Enter')document.getElementById('send').click();};function clearChat(){chat.innerHTML='';addMsg('A',"Hello! I am Afro AI for all. Created by Joseph Aria in PNG 🇵🇬\n\nI talk simple like to 10 year old 🧒 + I READ ALOUD 🔊\n\nAsk: What is internet? 🌟");}clearChat();
const mic=document.getElementById('micBtn');if('webkitSpeechRecognition' in window){const R=new webkitSpeechRecognition();R.lang='en-PG';mic.onclick=()=>{R.start();mic.textContent='🔴';};R.onresult=e=>{input.value=e.results[0][0].transcript;mic.textContent='🎤';};R.onend=()=>mic.textContent='🎤';}
</script></body></html>
