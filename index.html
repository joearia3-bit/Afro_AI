<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro AI for all. Created by Joseph Aria in PNG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui;background:#f5f5f5;height:100vh;display:flex;flex-direction:column}
#top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#f5f5f5}
#topLeft{display:flex;align-items:center;gap:10px}
#menu{width:44px;height:44px;border-radius:50%;background:white;border:0;box-shadow:0 1px 3px #0001;font-size:18px}
#getPlus{background:#e3f2fd;color:#0b57d0;border:0;padding:10px 18px;border-radius:24px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
#profile{width:44px;height:44px;border-radius:50%;background:white;border:0;box-shadow:0 1px 3px #0001;font-size:20px}
#center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:600px;margin:auto;width:100%}
.opt{display:flex;align-items:center;gap:16px;padding:16px 0;font-size:18px;color:#444;cursor:pointer}
.opt i{font-size:22px;width:28px;text-align:center;color:#666}
#chat{display:none;flex:1;overflow-y:auto;padding:16px;padding-bottom:140px;background:white}
.msg{display:flex;gap:12px;margin:16px 0;max-width:700px;margin-left:auto;margin-right:auto;width:100%}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:white;flex-shrink:0}
.av.user{background:black}.av.ai{background:#7c3aed}
.bub{background:#f5f5f5;padding:14px 16px;border-radius:18px;line-height:1.6;flex:1;white-space:pre-wrap;font-size:15px}
.msg.user.bub{background:#e3f2fd}
.speakBtn{margin-top:10px;border:0;background:#ede9fe;padding:6px 14px;border-radius:20px;color:#6d28d9;font-weight:700;font-size:12px}
#bottom{padding:12px;background:#f5f5f5;position:sticky;bottom:0}
#askBar{background:white;border-radius:28px;display:flex;align-items:center;padding:6px 8px;box-shadow:0 2px 12px #0001;border:1px solid #e5e5e5;max-width:700px;margin:auto}
#plusBtn{width:40px;height:40px;border:0;background:transparent;font-size:22px}
#input{flex:1;border:0;outline:none;padding:12px;font-size:16px;background:transparent}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:18px;cursor:pointer}
#voiceWave{background:#0b57d0;color:white}
#toolbar{display:flex;justify-content:space-around;padding:10px 0;color:#666;font-size:20px;max-width:700px;margin:8px auto 0;background:#00008;border-radius:16px}
#foot{text-align:center;font-size:11px;color:#888;padding:8px}
</style>
</head>
<body>
<div id="top">
<div id="topLeft">
<button id="menu"><i class="fa-solid fa-bars-staggered"></i></button>
<button id="getPlus"><i class="fa-solid fa-sparkles"></i> Get Plus</button>
</div>
<button id="profile"><i class="fa-regular fa-circle-user"></i></button>
</div>

<div id="center">
<div style="text-align:center;margin-bottom:40px">
<div style="width:60px;height:60px;background:linear-gradient(135deg,#9333ea,#6d28d9);border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:28px;margin:0 auto 12px">A</div>
<h2 style="font-size:20px">Afro AI — Made for All</h2>
<p style="font-size:12px;color:#666;margin-top:4px">Afro AI for all. Created by Joseph Aria in PNG 🇵🇬</p>
</div>
<div class="opt" onclick="startChat('Start a voice chat 🎧')"><i class="fa-solid fa-headphones"></i> Start a voice chat</div>
<div class="opt" onclick="startChat('Create an image or sticker 🖼️')"><i class="fa-regular fa-image"></i> Create an image or sticker</div>
<div class="opt" onclick="startChat('Write or edit ✏️')"><i class="fa-solid fa-pen"></i> Write or edit</div>
</div>

<div id="chat"></div>

<div id="bottom">
<div id="askBar">
<button id="plusBtn"><i class="fa-solid fa-plus"></i></button>
<input id="input" placeholder="Ask Afro AI">
<button class="icon" id="micBtn"><i class="fa-solid fa-microphone"></i></button>
<button class="icon" id="voiceWave"><i class="fa-solid fa-waveform"></i></button>
</div>
<div id="toolbar">
<i class="fa-solid fa-clone"></i>
<i class="fa-regular fa-face-smile-wink"></i>
<i class="fa-regular fa-clipboard"></i>
<span style="font-weight:700">aあ</span>
<i class="fa-solid fa-microphone"></i>
<i class="fa-solid fa-magnifying-glass"></i>
<i class="fa-solid fa-ellipsis"></i>
</div>
<div id="foot"><b>Afro AI for All</b> — Created by Joseph Aria in PNG 🇵🇬 — 2026<br>🧒 Simple: ON + 🔊 Voice</div>
</div>

<script>
const center=document.getElementById('center'); const chat=document.getElementById('chat'); const input=document.getElementById('input');
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let c=t.slice(0,500);let u=new SpeechSynthesisUtterance(c);u.rate=0.9;u.lang='en-AU';speechSynthesis.speak(u);}
function addMsg(r,t){
 if(center.style.display!=='none'){center.style.display='none';chat.style.display='block';}
 const d=document.createElement('div');d.className='msg '+r;
 const av=document.createElement('div');av.className='av '+r;av.textContent=r==='user'?'YOU':'AI';
 const bub=document.createElement('div');bub.className='bub';bub.textContent=t;
 if(r==='ai'){const btn=document.createElement('button');btn.className='speakBtn';btn.innerHTML='🔊 Read Aloud';btn.onclick=()=>speak(t);bub.appendChild(document.createElement('br'));bub.appendChild(btn);setTimeout(()=>speak(t),600);}
 d.appendChild(av);d.appendChild(bub);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function getAnswer(q){let l=q.toLowerCase();if(l.includes('voice'))return"Voice chat is ON! 🎧 Tap mic 🎤 and speak. I will READ ALOUD 🔊 answer for you.\n\nTry say: What is internet?";if(l.includes('image')||l.includes('sticker'))return"Image feature coming soon! 🖼️\nFor now I can describe how to draw.\n\nTell me what image you want — e.g. 'Draw flag of PNG' 🇵🇬";if(l.includes('write')||l.includes('edit'))return"Write or Edit mode ✏️\n\nTell me what to write — letter, story for pikinini, market list.\nI will use SIMPLE words for 10 year old 🧒";if(l.includes('internet'))return"Internet is like giant web of wires 🌐\nLike big river carrying messages between villages 🏠🛶\nYou see friends in Sydney, songs from Port Moresby 🎧\nFast like letter 📬⚡ Great question! 🌟";return"Good question! 🌟\n\n"+q+"\n\nThink like village tool 🛠️ Helps you work faster.\n\nYou are smart! 💪🌟";}
function send(){if(!input.value.trim())return;let q=input.value;addMsg('user',q);input.value='';setTimeout(()=>addMsg('ai',getAnswer(q)),500);}
function startChat(t){addMsg('user',t);setTimeout(()=>addMsg('ai',getAnswer(t)),500);}
document.getElementById('voiceWave').onclick=send;
document.getElementById('plusBtn').onclick=()=>alert('Afro AI — Created by Joseph Aria in PNG 🇵🇬\nSimple + Voice for all!');
input.onkeydown=e=>{if(e.key==='Enter')send();};
const mic=document.getElementById('micBtn');
if('webkitSpeechRecognition' in window){const R=new webkitSpeechRecognition();R.lang='en-PG';mic.onclick=()=>{R.start();mic.innerHTML='<i class="fa-solid fa-circle" style="color:red"></i>';};R.onresult=e=>{input.value=e.results[0][0].transcript;mic.innerHTML='<i class="fa-solid fa-microphone"></i>';send();};R.onend=()=>mic.innerHTML='<i class="fa-solid fa-microphone"></i>';}
else mic.onclick=()=>{input.focus();};
</script>
</body>
</html>
