<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101010;color:#fff}
.app{height:100dvh;display:flex;overflow:hidden}
.side{width:230px;background:#181818;padding:12px;display:flex;flex-direction:column}
.logo{font-size:22px;font-weight:bold;padding:10px}
.new{width:100%;margin:5px 0 15px}
.chats{overflow:auto}
.chatbtn{width:100%;background:none;color:#ddd;text-align:left;margin:3px 0;padding:9px}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
header{padding:12px 15px;background:#181818;display:flex;justify-content:space-between;align-items:center}
.title{font-size:20px;font-weight:bold}
#status{font-size:12px;color:#aaa}
#messages{flex:1;min-height:0;overflow-y:auto;padding:15px}
.msg{max-width:850px;margin:10px auto;padding:12px 15px;border-radius:14px;white-space:pre-wrap;line-height:1.5}
.user{background:#333}
.ai{background:#202020}
.copy{font-size:12px;padding:5px;margin-top:7px}
.loading{text-align:center;color:#aaa;padding:7px;min-height:30px}
.inputbox{padding:10px;background:#181818;display:flex;gap:8px}
textarea{flex:1;resize:none;height:48px;padding:13px;border:0;border-radius:12px;font-size:16px;background:#292929;color:white}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:bold;cursor:pointer}
.send{background:white;color:#111}
@media(max-width:650px){
.side{display:none}
.msg{margin:8px 0}
header{padding:10px}
.inputbox{padding:8px}
}
</style>
</head>

<body>
<div class="app">

<aside class="side">
<div class="logo">🌍 Afro AI</div>
<button class="new" onclick="newChat()">＋ New Chat</button>
<div id="chatList" class="chats"></div>
</aside>

<main class="main">
<header>
<div class="title">Afro AI</div>
<div id="status">Ready</div>
</header>

<div id="messages"></div>
<div id="loading" class="loading"></div>

<div class="inputbox">
<textarea id="input" placeholder="Ask Afro AI..." onkeydown="key(event)"></textarea>
<button class="send" onclick="send()">Send</button>
</div>
</main>

</div>

<script>
const $=id=>document.getElementById(id);
const KEY="afro_ai_chats";

let chats=JSON.parse(localStorage.getItem(KEY)||"[]");
let current=0;
let webAI=null;
let cpuAI=null;

function save(){localStorage.setItem(KEY,JSON.stringify(chats))}
function newChat(){
 chats.unshift({title:"New Chat",messages:[]});
 current=0;save();draw();
}
if(!chats.length)newChat();

function draw(){
 $("messages").innerHTML="";
 let c=chats[current];
 c.messages.forEach((m,i)=>addScreen(m.role,m.text,i));
 $("chatList").innerHTML="";
 chats.forEach((c,i)=>{
  let b=document.createElement("button");
  b.className="chatbtn";
  b.textContent="💬 "+c.title;
  b.onclick=()=>{current=i;draw()};
  $("chatList").appendChild(b);
 });
 $("messages").scrollTop=$("messages").scrollHeight;
}

function addScreen(role,text,i=-1){
 let d=document.createElement("div");
 d.className="msg "+role;
 d.textContent=text;

 if(role==="ai"){
  let b=document.createElement("button");
  b.className="copy";
  b.textContent="Copy";
  b.onclick=()=>navigator.clipboard?.writeText(text);
  d.appendChild(document.createElement("br"));
  d.appendChild(b);
 }
 $("messages").appendChild(d);
}

function add(role,text){
 let c=chats[current];
 c.messages.push({role,text});
 if(role==="user"&&c.messages.length===1)
   c.title=text.slice(0,28);
 save();draw();
}

/* FAST LOCAL TOOLS */
function localTool(q){
 let x=q.toLowerCase();

 if(/what('?s| is)? the time|current time/.test(x))
   return "Current time: "+new Date().toLocaleTimeString();

 if(/what('?s| is)? today|what date|current date/.test(x))
   return "Today's date: "+new Date().toLocaleDateString();

 if(x.startsWith("calculate ")){
  try{
   let e=q.slice(10).replace(/[^0-9+\-*/().% ]/g,"");
   return "Answer: "+Function("return "+e)();
  }catch{}
 }

 if(x.startsWith("word count ")){
  return "Word count: "+q.slice(11).trim().split(/\s+/).filter(Boolean).length;
 }

 let m=q.match(/^convert\s+([\d.]+)\s*(km|m|cm|kg|g)\s+to\s+(km|m|cm|kg|g)$/i);
 if(m){
  let v=+m[1],a=m[2].toLowerCase(),b=m[3].toLowerCase();
  let u={km:1000,m:1,cm:.01,kg:1000,g:1};
  if((a==="kg")!==(b==="kg")||(a==="km"||a==="m"||a==="cm")!==(b==="km"||b==="m"||b==="cm"))
   return "I can only convert compatible units.";
  return `${v} ${a} = ${v*u[a]/u[b]} ${b}`;
 }
 return null;
}

/* WEBGPU AI */
async function loadWebAI(){
 if(webAI)return webAI;
 $("status").textContent="Starting AI...";

 try{
  const m=await import("https://esm.run/@mlc-ai/web-llm");
  let e=new m.MLCEngine();

  await e.reload("Llama-3.2-1B-Instruct-q4f16_1-MLC",{
   initProgressCallback:p=>{
    $("status").textContent="AI "+Math.round(p.progress*100)+"%";
   }
  });

  webAI=e;
  return e;
 }catch(e){return null}
}

/* CPU/WASM FALLBACK */
async function loadCPUAI(){
 if(cpuAI)return cpuAI;

 try{
  const m=await import(
   "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
  );

  cpuAI=await m.pipeline(
   "text-generation",
   "HuggingFaceTB/SmolLM2-360M-Instruct",
   {device:"wasm"}
  );

  return cpuAI;
 }catch(e){return null}
}

function prompt(){
 let history=chats[current].messages.slice(-8);
 return history.map(m=>
  (m.role==="user"?"User: ":"Assistant: ")+m.text
 ).join("\n")+"\nAssistant:";
}

/* AI WITH FALLBACKS */
async function askAI(){
 let p=prompt();

 try{
  let e=await loadWebAI();
  if(e){
   let r=await e.chat.completions.create({
    messages:[
     {role:"system",content:
      "You are Afro AI. Be helpful, accurate, concise and honest. "+
      "If one method cannot complete a task, use another available method."
     },
     ...chats[current].messages.slice(-8).map(m=>({
      role:m.role==="user"?"user":"assistant",
      content:m.text
     }))
    ],
    temperature:.5,
    max_tokens:350
   });
   return r.choices[0].message.content;
  }
 }catch(e){}

 /* SECOND OPTION */
 try{
  let pipe=await loadCPUAI();
  if(pipe){
   let r=await pipe(p,{max_new_tokens:250});
   return r[0].generated_text.split("Assistant:").pop().trim();
  }
 }catch(e){}

 return "I couldn't start a local AI model on this device. The local tools are still available.";
}

async function send(){
 let box=$("input"),text=box.value.trim();
 if(!text)return;

 box.value="";
 add("user",text);

 let local=localTool(text);
 if(local){
  add("ai",local);
  return;
 }

 $("loading").textContent="Thinking...";
 $("status").textContent="Working...";

 try{
  let answer=await askAI();
  add("ai",answer);
 }catch(e){
  add("ai","I couldn't complete that task. Please try again.");
 }

 $("loading").textContent="";
 $("status").textContent="Ready";
}

function key(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();send();
 }
}

draw();
</script>
</body>
</html>
