<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - Made for All</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#fff;color:#111;display:flex;flex-direction:column;height:100vh}header{padding:16px;text-align:center;border-bottom:1px solid #eee;font-weight:800}#chatArea{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.welcome{text-align:center;margin-top:50px}.logo{width:84px;height:84px;background:#6d28d9;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900;margin:0 auto 16px}.qs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}.qs button{border:1px solid #ddd;background:#f5f5f5;padding:10px 16px;border-radius:22px;cursor:pointer}.user-msg{align-self:flex-end;background:#6d28d9;color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;max-width:85%}.ai-msg{align-self:flex-start;background:#f3f3f6;padding:12px 16px;border-radius:18px 18px 18px 4px;max-width:85%;line-height:1.5;white-space:pre-wrap}.inputBar{padding:12px;border-top:1px solid #eee;display:flex;gap:8px;align-items:center}.inputBar input{flex:1;padding:14px 18px;border-radius:28px;border:1px solid #ddd;background:#f5f5f7}.inputBar button{width:46px;height:46px;border-radius:50%;border:none;background:#6d28d9;color:#fff;font-size:20px}#mic{background:#eee;color:#111}</style></head><body><header>Afro AI — Made for All</header><div id="chatArea"><div class="welcome" id="welcome"><div class="logo">A</div><h1>Welcome to Afro AI</h1><p>Your assistant — fast, light, and made for all.</p><div class="qs"><button onclick="ask('What can you do?')">What can you do?</button><button onclick="ask('Business ideas for PNG')">Business ideas</button><button onclick="ask('Explain topic simply')">Explain</button></div></div></div><div class="inputBar"><button id="mic" onclick="voice()">🎤</button><input id="msg" placeholder="Message Afro AI..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div><script>let chat=document.getElementById('chatArea'),inp=document.getElementById('msg'),first=true;function add(t,c){if(first){document.getElementById('welcome')?.remove();first=false}let d=document.createElement('div');d.className=c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}function ask(t){inp.value=t;send()}async function send(){let q=inp.value.trim();if(!q)return;add(q,'user-msg');inp.value='';let th=add('●●● Afro AI is thinking...','ai-msg');try{let s="You are Afro AI, made for all. Built by Joe in PNG. Friendly, helpful, concise. Never say you are another AI.";let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(s+'\nUser: '+q+'\nAfro AI:'));let a=await r.text();th.innerText=a.trim()}catch(e){th.innerText="I am Afro AI — made for all. Connection hiccup, ask again: "+q}}function voice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Use Chrome');return}let rec=new SR();rec.lang='en-US';rec.start();rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()}}</script></body></html>
