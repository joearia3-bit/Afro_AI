<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - Made for All</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#fff;display:flex;flex-direction:column;height:100vh}header{padding:16px;text-align:center;border-bottom:1px solid #eee;font-weight:800}#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.welcome{text-align:center;margin-top:60px}.logo{width:80px;height:80px;background:#6d28d9;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto 16px}.user{background:#6d28d9;color:#fff;align-self:flex-end;padding:12px 16px;border-radius:18px 18px 4px 18px;max-width:80%}.ai{background:#f1f1f1;align-self:flex-start;padding:12px 16px;border-radius:18px 18px 18px 4px;max-width:80%;white-space:pre-wrap}.bar{padding:12px;border-top:1px solid #eee;display:flex;gap:8px}.bar input{flex:1;padding:14px;border-radius:24px;border:1px solid #ddd;background:#f5f5f5}.bar button{width:44px;height:44px;border-radius:50%;border:none;background:#6d28d9;color:#fff}</style></head><body><header>Afro AI — Made for All</header><div id="chat"><div class="welcome" id="w"><div class="logo">A</div><h1>Welcome to Afro AI</h1><p>Fast, light, made for all — from PNG</p></div></div><div class="bar"><input id="m" placeholder="Message Afro AI..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div><script>let c=document.getElementById('chat'),i=document.getElementById('m'),f=true;function add(t,k){if(f){document.getElementById('w').remove();f=false}let d=document.createElement('div');d.className=k;d.innerText=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d}async function send(){let q=i.value.trim();if(!q)return;add(q,'user');i.value='';let th=add('Thinking...','ai');try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('You are Afro AI, made for all, built by Joe in PNG. Be helpful and concise. User:'+q));let a=await r.text();th.innerText=a.trim()}catch(e){th.innerText='Connection slow, try again: '+q}}</script></body></html>
