<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - Made for All</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#fff;display:flex;flex-direction:column;height:100vh}header{padding:14px;text-align:center;border-bottom:1px solid #eee;font-weight:800;display:flex;justify-content:space-between;align-items:center}#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.welcome{text-align:center;margin-top:50px}.logo{width:84px;height:84px;background:#6d28d9;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:900;margin:0 auto 14px}.bubble{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5;font-size:15px}.user{align-self:flex-end;background:#6d28d9;color:#fff;border-bottom-right-radius:4px}.ai{align-self:flex-start;background:#f3f3f6;border-bottom-left-radius:4px;white-space:pre-wrap}.ai.tp{margin-top:8px;padding-top:8px;border-top:1px dashed #ccc;font-style:italic;color:#4c1d95;display:none}.bar{padding:10px;border-top:1px solid #eee;display:flex;gap:7px;align-items:center}.icon{width:40px;height:40px;border-radius:50%;border:1px solid #e5e7eb;background:#f7f3ff;display:grid;place-items:center;font-size:16px;cursor:pointer;flex-shrink:0}#msg{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #ddd;background:#f5f5f7;outline:none}#send{width:42px;height:42px;border-radius:50%;border:none;background:#6d28d9;color:#fff}#file{display:none}</style></head><body>
<header><b>Afro AI — Made for All</b><button id="tpBtn" class="icon" style="width:auto;padding:0 12px;border-radius:20px;font-size:12px;font-weight:700" onclick="toggleTP()">🌐 Tok Pisin</button></header>
<div id="chat"><div class="welcome" id="w"><div class="logo">A</div><h2>Welcome to Afro AI</h2><p>Built by Joe in PNG — now with Tok Pisin translator</p></div></div>
<div class="bar"><label for="file" class="icon">📷</label><input id="file" type="file" accept="image/*"><button class="icon" id="micBtn">🎤</button><input id="msg" placeholder="Message Afro AI..." onkeydown="if(event.key==='Enter')send()"><button id="send" onclick="send()">↑</button></div>
<script>
let chat=document.getElementById('chat'),inp=document.getElementById('msg'),fileInp=document.getElementById('file'),micBtn=document.getElementById('micBtn'),first=true,lastImg=null,lastAiBubble=null,lastAiText='',tpMode=false,recognizing=false;
function add(t,c,h){if(first){document.getElementById('w')?.remove();first=false}let d=document.createElement('div');d.className='bubble '+c;if(h)d.innerHTML=t;else d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function addImg(src,c){let d=add('',c,true);let im=document.createElement('img');im.src=src;im.style.maxWidth='100%';im.style.borderRadius='12px';d.appendChild(im);return d}
fileInp.onchange=()=>{let f=fileInp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{lastImg=e.target.result;add('Photo ready ✓','ai');addImg(lastImg,'user')};r.readAsDataURL(f)}
async function send(){let q=inp.value.trim();if(!q&&!lastImg)return;let hasImg=!!lastImg,img=lastImg;if(q)add(q,'user');if(hasImg)addImg(img,'user');inp.value='';lastImg=null;fileInp.value='';let th=add('Thinking...','ai');lastAiBubble=th;try{let ans='';if(hasImg){let p={model:'openai',messages:[{role:'system',content:'You are Afro AI built by Joe in PNG.'},{role:'user',content:[{type:'text',text:q||'Describe image'},{type:'image_url',image_url:{url:img}}]}]};let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j=await r.json();ans=j.choices?.[0]?.message?.content||'No describe.'}else{let s='You are Afro AI built by Joe in PNG.';let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(s+' User:'+q));ans=await r.text()}th.innerText=ans.trim();lastAiText=ans.trim();let tp=document.createElement('div');tp.className='tp';th.appendChild(tp);if(tpMode)translateBubble(th,lastAiText)}catch(e){th.innerText='Slow net, try again: '+q}}
async function translateBubble(b,t){let d=b.querySelector('.tp');if(!d)return;d.style.display='block';d.innerText='Translating to Tok Pisin...';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Translate to Tok Pisin PNG Pidgin natural simple: '+t));let x=await r.text();d.innerText='🇵🇬 Tok Pisin: '+x.trim()}catch(e){d.innerText='Could not translate.'}}
function toggleTP(){tpMode=!tpMode;let b=document.getElementById('tpBtn');b.style.background=tpMode?'#6d28d9':'#f7f3ff';b.style.color=tpMode?'#fff':'#111';b.innerText=tpMode?'✓ Tok Pisin ON':'🌐 Tok Pisin';if(tpMode&&lastAiBubble)translateBubble(lastAiBubble,lastAiText)}
micBtn.onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Use Chrome');return}let rec=new SR();rec.lang='en-US';rec.start();rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()}}
</script></body></html>
