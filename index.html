<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fff;color:#000;height:100vh;display:flex}
.side{width:260px;background:#f9f9f9;border-right:1px solid #e5e5e5;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.new{width:100%;background:#fff;border:1px solid #ddd;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;background:#fff}
.top{height:56px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:18px}
.center{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:55vh}
.logo{width:64px;height:64px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.welcome h1{font-size:30px;margin-top:18px}
.msg{margin:16px 0;display:flex;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.msg.user .av{background:#e5e5e5;color:#000}
.txt{line-height:1.6;padding-top:4px;white-space:pre-wrap;font-size:15px}
.inputW{padding:14px;max-width:800px;margin:0 auto;width:100%}
.box{background:#f4f4f4;border-radius:28px;display:flex;padding:6px 8px 6px 18px;align-items:center;border:1px solid #e5e5e5}
.box input{flex:1;background:transparent;border:none;outline:none;font-size:16px}
.box button{width:36px;height:36px;background:#000;color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:18px}
.foot{font-size:11px;color:#999;text-align:center;margin-top:8px}
@media(max-width:700px){.side{display:none}}
</style>
</head><body>
<div class="side">
<button class="new" onclick="location.reload()">⊕ New chat</button>
<div style="margin-top:20px;font-size:13px;color:#666">Afro AI v2 - Super Fast</div>
<div style="font-size:12px;margin-top:auto;border-top:1px solid #ddd;padding-top:10px">Joe • PNG 🇵🇬</div>
</div>
<div class="main">
<div class="top">Afro AI ▼</div>
<div class="center" id="center">
<div id="welcome" class="welcome"><div class="logo">A</div><h1>What can I help with?</h1></div>
<div id="chat"></div>
</div>
<div class="inputW">
<div class="box"><input id="in" placeholder="Message Afro AI..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()" id="btn">↑</button></div>
<div class="foot">Afro AI - Fast & Smart • Powered by GPT-4o</div>
</div>
</div>
<script>
const chatEl=document.getElementById('chat');
const inpEl=document.getElementById('in');
const welcome=document.getElementById('welcome');

async function send(){
  const q=inpEl.value.trim(); if(!q) return;
  if(welcome) welcome.style.display='none';
  chatEl.innerHTML+=`<div class="msg user"><div class="av">J</div><div class="txt">${q}</div></div>`;
  inpEl.value='';
  const id='ai-'+Date.now();
  chatEl.innerHTML+=`<div class="msg"><div class="av">A</div><div class="txt" id="${id}">Thinking...</div></div>`;
  document.getElementById('center').scrollTop=99999;
  
  try{
    // SUPER FAST & SMART - uses GPT-4o mini via Puter
    const response = await puter.ai.chat(q, { model: "gpt-4o-mini", stream: false });
    let answer = response.message?.content || response.toString();
    
    // Make it PNG style
    document.getElementById(id).innerText = answer;
  }catch(e){
    document.getElementById(id).innerText = "Error: "+e.message+" - Trying backup...";
    try{
      const backup = await puter.ai.chat(q, { model: "claude-3-5-sonnet" });
      document.getElementById(id).innerText = backup.message?.content || backup.toString();
    }catch(e2){
      document.getElementById(id).innerText = "AI offline. You asked: "+q+"\n\nTry again - check internet.";
    }
  }
  document.getElementById('center').scrollTop=99999;
}
</script>
</body></html>
