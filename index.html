<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - Real Brain by Joseph Aria PNG</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f7f7f8;height:100vh;display:flex;flex-direction:column}#top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}#mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;max-width:600px;margin:auto;width:100%}#logo{width:64px;height:64px;background:linear-gradient(135deg,#9333ea,#6d28d9);border-radius:18px;color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;margin-bottom:12px}.opt{width:100%;display:flex;gap:16px;padding:18px 0;font-size:18px;color:#333;cursor:pointer;border-bottom:1px solid #eee}#chat{display:none;flex:1;overflow:auto;padding:16px;padding-bottom:150px;background:white}.msg{display:flex;gap:12px;margin:16px auto;max-width:700px;width:100%}.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:11px;flex-shrink:0}.user{background:#000}.ai{background:#7c3aed}.bub{background:#f5f5f5;padding:14px 16px;border-radius:20px;line-height:1.6;flex:1;white-space:pre-wrap;font-size:15px}.userB{background:#e3f2fd}.speakBtn{margin-top:10px;border:0;background:#ede9fe;padding:7px 14px;border-radius:20px;color:#6d28d9;font-weight:700;font-size:12px}#bottom{padding:12px;background:#f7f7f8;position:sticky;bottom:0}#bar{background:white;border-radius:28px;display:flex;align-items:center;padding:6px 10px;box-shadow:0 2px 12px #0001;border:1px solid #e5e5e5;max-width:720px;margin:auto}#input{flex:1;border:0;outline:none;padding:12px;font-size:16px;background:transparent}.ib{width:38px;height:38px;border-radius:50%;border:0;background:#f1f1f1;cursor:pointer}#send{background:#000;color:white}</style></head><body>
<div id="top"><button style="width:42px;height:42px;border-radius:50%;background:white;border:0;box-shadow:0 1px 3px #0001"><i class="fa-solid fa-bars"></i></button><button style="background:#e3f2fd;color:#0b57d0;border:0;padding:9px 16px;border-radius:24px;font-weight:700"><i class="fa-solid fa-sparkles"></i> Get Plus</button><button style="width:42px;height:42px;border-radius:50%;background:white;border:0;box-shadow:0 1px 3px #0001"><i class="fa-regular fa-user"></i></button></div>
<div id="mid"><div id="logo">A</div><h3>Afro AI — Made for All</h3><p style="font-size:12px;color:#666;margin:6px 0 32px;text-align:center">Afro AI for all. Created by Joseph Aria in PNG 🇵🇬<br><b>REAL AI BRAIN ACTIVE 🧠</b></p>
<div class="opt" onclick="ask('What is AI? Explain like I am 10 years old from PNG village')"><i class="fa-solid fa-headphones" style="width:24px"></i> Start a voice chat</div>
<div class="opt" onclick="ask('Write a short story about PNG pikinini')"><i class="fa-regular fa-image" style="width:24px"></i> Create an image or sticker</div>
<div class="opt" onclick="ask('Help me write a letter to my wantok')"><i class="fa-solid fa-pen" style="width:24px"></i> Write or edit</div>
</div>
<div id="chat"></div>
<div id="bottom"><div id="bar"><button class="ib"><i class="fa-solid fa-plus"></i></button><input id="input" placeholder="Ask Afro AI anything - Real AI"><button class="ib" id="mic"><i class="fa-solid fa-microphone"></i></button><button class="ib" id="send" onclick="send()"><i class="fa-solid fa-arrow-up"></i></button></div><div style="text-align:center;font-size:10px;color:#888;margin-top:8px">Afro AI for All — Created by Joseph Aria in PNG 🇵🇬 — Real Brain 🧠 + Voice 🔊</div></div>
<script>
const mid=document.getElementById('mid'),chat=document.getElementById('chat'),input=document.getElementById('input');
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.slice(0,1000).replace(/[*#]/g,''));u.rate=0.9;u.lang='en-AU';speechSynthesis.speak(u);}
function add(role,text,isUser){if(mid.style.display!=='none'){mid.style.display='none';chat.style.display='block';}let m=document.createElement('div');m.className='msg';let av=document.createElement('div');av.className='av '+(role==='user'?'user':'ai');av.textContent=role==='user'?'YOU':'AI';let b=document.createElement('div');b.className='bub '+(isUser?'userB':'');b.textContent=text;m.appendChild(av);m.appendChild(b);chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return b;}
async function realBrain(q){
 let wait=add('ai','Afro AI is thinking... 🧠 Real brain working...');
 try{
  let prompt=`You are Afro AI, created by Joseph Aria from PNG. Explain simply, like to a 10 year old village child in PNG. Use simple English, short sentences, emojis, encouraging. Question: ${q}`;
  let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
  let t=await r.text(); if(!t||t.length<10) throw 'empty';
  return t.substring(0,1800);
 }catch(e){ return "Brain busy (PNG internet slow) 🌐 Try again! Quick: "+q+" is important. Afro AI will explain soon! You are smart! 🌟 Try again in 5 sec.";}
}
async function send(){let q=input.value.trim();if(!q)return;add('user',q,true);input.value='';let b=add('ai','...');let ans=await realBrain(q);b.textContent=ans;let btn=document.createElement('button');btn.className='speakBtn';btn.textContent='🔊 Read Aloud';btn.onclick=()=>speak(ans);b.appendChild(document.createElement('br'));b.appendChild(btn);speak(ans);chat.scrollTop=chat.scrollHeight;}
function ask(t){input.value=t;send();}
input.onkeydown=e=>{if(e.key==='Enter')send();};
let mic=document.getElementById('mic');if('webkitSpeechRecognition' in window){let R=new webkitSpeechRecognition();R.lang='en-PG';mic.onclick=()=>{R.start();mic.innerHTML='🔴';};R.onresult=e=>{input.value=e.results[0][0].transcript;mic.innerHTML='<i class="fa-solid fa-microphone"></i>';send();};R.onend=()=>mic.innerHTML='<i class="fa-solid fa-microphone"></i>';}
</script></body></html>
