<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afro AI</title>

<style>
:root {
    --bg: #ffffff;
    --sidebar: #f7f7f8;
    --text: #202123;
    --muted: #6b6b6b;
    --border: #dddddd;
    --assistant: #f7f7f8;
    --accent: #111111;
}

body.dark {
    --bg: #181818;
    --sidebar: #202020;
    --text: #f5f5f5;
    --muted: #aaaaaa;
    --border: #383838;
    --assistant: #222222;
    --accent: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
    flex-shrink: 0;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.brand-small {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: bold;
    font-size: 19px;
}

.logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.close-sidebar {
    display: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 27px;
}

.new-chat {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 9px;
    padding: 12px;
    font-size: 15px;
    text-align: left;
    margin-bottom: 20px;
}

.history-label {
    font-size: 12px;
    color: var(--muted);
    margin: 0 8px 10px;
}

.chat-history {
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover,
.history-item.active {
    background: var(--border);
}

.delete-all {
    margin-top: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 8px;
    font-size: 12px;
}

.sidebar-bottom {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding: 14px 8px 5px;
}

.sidebar-bottom strong {
    display: block;
    margin-bottom: 4px;
}

.sidebar-bottom span {
    font-size: 12px;
    color: var(--muted);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.header {
    height: 62px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.mobile-menu {
    display: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 25px;
}

.header-title {
    font-size: 18px;
    font-weight: bold;
}

.icon-button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text);
    font-size: 19px;
}

.icon-button:hover {
    background: var(--sidebar);
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15px 150px;
}

.welcome {
    max-width: 700px;
    margin: 80px auto 0;
    text-align: center;
}

.welcome-logo {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    font-size: 28px;
    font-weight: bold;
}

.welcome h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 30px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.suggestion {
    padding: 15px;
    background: var(--sidebar);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: left;
    font-size: 14px;
}

/* MESSAGES */

.message {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 14px;
    padding: 20px 5px;
    line-height: 1.6;
}

.message.ai {
    background: var(--assistant);
    border-radius: 12px;
    padding-left: 15px;
    padding-right: 15px;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.user .avatar {
    background: #666;
    color: white;
}

.message-body {
    flex: 1;
    min-width: 0;
    word-wrap: break-word;
}

.copy-button {
    margin-top: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
    padding: 8px 0;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: .2s;
}

.dot:nth-child(3) {
    animation-delay: .4s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
    }
    30% {
        transform: translateY(-5px);
    }
}

/* INPUT */

.input-wrapper {
    position: fixed;
    bottom: 0;
    left: 270px;
    right: 0;
    background: linear-gradient(
        transparent,
        var(--bg) 25%
    );
    padding: 35px 15px 15px;
}

.input-box {
    max-width: 820px;
    margin: auto;
}

.form {
    display: flex;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 7px;
}

.form input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 11px;
}

.send {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: var(--bg);
    font-size: 18px;
}

.disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        left: -285px;
        top: 0;
        bottom: 0;
        z-index: 100;
        transition: left .2s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,.15);
    }

    .sidebar.open {
        left: 0;
    }

    .close-sidebar,
    .mobile-menu {
        display: block;
    }

    .header {
        padding: 0 12px;
    }

    .chat {
        padding: 15px 10px 145px;
    }

    .welcome {
        margin-top: 60px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .message {
        padding: 15px 5px;
    }

    .input-wrapper {
        left: 0;
        padding: 30px 10px 10px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="sidebar-top">

        <div class="brand-small">
            <div class="logo">A</div>
            <span>Afro AI</span>
        </div>

        <button
            class="close-sidebar"
            id="closeSidebar">
            ×
        </button>

    </div>

    <button
        class="new-chat"
        id="newChat">
        ＋ New Chat
    </button>

    <div class="history-label">
        Recent Chats
    </div>

    <div
        class="chat-history"
        id="chatHistory">
    </div>

    <button
        class="delete-all"
        id="deleteAll">
        Clear Chat History
    </button>

    <div class="sidebar-bottom">
        <strong>Afro AI</strong>
        <span>Your AI assistant</span>
    </div>

</aside>


<main class="main">

<header class="header">

    <div class="header-left">

        <button
            class="mobile-menu"
            id="openSidebar">
            ☰
        </button>

        <span class="header-title">
            Afro AI
        </span>

    </div>

    <button
        class="icon-button"
        id="themeButton"
        title="Dark mode">
        ◐
    </button>

</header>


<section
    class="chat"
    id="chat">
</section>


<div class="input-wrapper">

    <div class="input-box">

        <form
            class="form"
            id="chatForm">

            <input
                id="messageInput"
                type="text"
                placeholder="Message Afro AI..."
                autocomplete="off">

            <button
                class="send"
                type="submit">
                ➤
            </button>

        </form>

        <p class="disclaimer">
            Afro AI can make mistakes.
            Check important information.
        </p>

    </div>

</div>

</main>

</div>


<script>

/* =========================
   AFRO AI CHAT SYSTEM
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const form =
    document.getElementById("chatForm");

const newChatButton =
    document.getElementById("newChat");

const historyBox =
    document.getElementById("chatHistory");

const deleteAll =
    document.getElementById("deleteAll");

const sidebar =
    document.getElementById("sidebar");

const openSidebar =
    document.getElementById("openSidebar");

const closeSidebar =
    document.getElementById("closeSidebar");

const themeButton =
    document.getElementById("themeButton");


let chats =
    JSON.parse(
        localStorage.getItem("afroChats") || "[]"
    );

let currentChat = null;


/* CREATE CHAT */

function createChat() {

    const id =
        Date.now().toString();

    const newChat = {
        id: id,
        title: "New Chat",
        messages: []
    };

    chats.unshift(newChat);

    currentChat = id;

    saveChats();

    renderHistory();

    renderChat();
}


/* SAVE */

function saveChats() {

    localStorage.setItem(
        "afroChats",
        JSON.stringify(chats)
    );
}


/* CURRENT CHAT */

function getCurrentChat() {

    return chats.find(
        chat => chat.id === currentChat
    );
}


/* RENDER HISTORY */

function renderHistory() {

    historyBox.innerHTML = "";

    chats.forEach(function(item) {

        const button =
            document.createElement("div");

        button.className =
            "history-item";

        if (item.id === currentChat) {
            button.classList.add("active");
        }

        button.textContent =
            item.title;

        button.addEventListener(
            "click",
            function() {

                currentChat =
                    item.id;

                renderHistory();
                renderChat();

                sidebar.classList.remove(
                    "open"
                );
            }
        );

        historyBox.appendChild(button);

    });
}


/* RENDER CHAT */

function renderChat() {

    chat.innerHTML = "";

    const current =
        getCurrentChat();

    if (!current ||
        current.messages.length === 0) {

        chat.innerHTML = `

            <div class="welcome">

                <div class="welcome-logo">
                    A
                </div>

                <h1>
                    Welcome to Afro AI
                </h1>

                <p>
                    Your simple, smart AI assistant.
                    Ask a question and start chatting.
                </p>

                <div class="suggestions">

                    <button class="suggestion">
                        Explain something simply
                    </button>

                    <button class="suggestion">
                        Help me write something
                    </button>

                    <button class="suggestion">
                        Help me learn coding
                    </button>

                    <button class="suggestion">
                        Give me an idea
                    </button>

                </div>

            </div>
        `;

        activateSuggestions();

        return;
    }


    current.messages.forEach(function(message) {

        addMessageToScreen(
            message.text,
            message.type
        );

    });

    scrollBottom();
}


/* ADD MESSAGE */

function addMessageToScreen(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.innerHTML = `

        <div class="avatar">
            ${type === "user" ? "You" : "A"}
        </div>

        <div class="message-body">

            <div>
                ${escapeHTML(text)}
            </div>

            ${
                type === "ai"
                ? `<button class="copy-button">
                    Copy
                   </button>`
                : ""
            }

        </div>
    `;

    chat.appendChild(message);


    if (type === "ai") {

        const copy =
            message.querySelector(
                ".copy-button"
            );

        copy.addEventListener(
            "click",
            function() {

                navigator.clipboard.writeText(
                    text
                );

                copy.textContent =
                    "Copied!";

                setTimeout(
                    () => copy.textContent = "Copy",
                    1500
                );

            }
        );

    }
}


/* SEND */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const text =
            input.value.trim();

        if (!text) return;

        if (!currentChat) {
            createChat();
        }

        const current =
            getCurrentChat();

        if (
            current.messages.length === 0
        ) {

            current.title =
                text.length > 28
                ? text.substring(0, 28) + "..."
                : text;

        }


        current.messages.push({
            type: "user",
            text: text
        });


        saveChats();

        renderHistory();

        renderChat();

        input.value = "";

        showTyping();


        setTimeout(
            function() {

                removeTyping();

                const response =
                    "Afro AI received your message: " +
                    text +
                    ". The real AI model will be connected through a secure backend.";

                current.messages.push({
                    type: "ai",
                    text: response
                });

                saveChats();

                renderChat();

            },
            900
        );

    }
);


/* NEW CHAT */

newChatButton.addEventListener(
    "click",
    function() {

        createChat();

        sidebar.classList.remove(
            "open"
        );

        input.focus();

    }
);


/* TYPING */

function showTyping() {

    const typing =
        document.createElement("div");

    typing.id = "typing";

    typing.className =
        "message ai";

    typing.innerHTML = `

        <div class="avatar">
            A
        </div>

        <div class="message-body">

            <div class="typing">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>
    `;

    chat.appendChild(typing);

    scrollBottom();
}


function removeTyping() {

    const typing =
        document.getElementById(
            "typing"
        );

    if (typing) {
        typing.remove();
    }
}


/* CLEAR HISTORY */

deleteAll.addEventListener(
    "click",
    function() {

        if (
            !confirm(
                "Delete all Afro AI chat history?"
            )
        ) {
            return;
        }

        chats = [];

        currentChat = null;

        saveChats();

        renderHistory();

        renderChat();

    }
);


/* DARK MODE */

themeButton.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "dark"
        );

        localStorage.setItem(
            "afroTheme",
            document.body.classList.contains(
                "dark"
            )
            ? "dark"
            : "light"
        );

    }
);


if (
    localStorage.getItem(
        "afroTheme"
    ) === "dark"
) {

    document.body.classList.add(
        "dark"
    );

}


/* MOBILE SIDEBAR */

openSidebar.addEventListener(
    "click",
    function() {

        sidebar.classList.add(
            "open"
        );

    }
);


closeSidebar.addEventListener(
    "click",
    function() {

        sidebar.classList.remove(
            "open"
        );

    }
);


/* SUGGESTIONS */

function activateSuggestions() {

    document
        .querySelectorAll(".suggestion")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    input.value =
                        button.textContent.trim();

                    input.focus();

                }
            );

        });

}


/* SCROLL */

function scrollBottom() {

    chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
    });

}


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/* START */

if (chats.length > 0) {

    currentChat =
        chats[0].id;

} else {

    createChat();

}

renderHistory();

renderChat();

</script>

</body>
</html>
