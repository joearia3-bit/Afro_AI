<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fff;color:#000;height:100vh;display:flex;flex-direction:column}
.top{height:50px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 20px;font-weight:600}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;max-width:800px;margin:0 auto;width:100%}
.logo{width:60px;height:60px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
h1{font-size:28px;margin:20px 0 30px;text-align:center}
.chat{width:100%;display:flex;flex-direction:column;gap:16px}
.bubble{padding:12px 16px;border-radius:18px;max-width:80%;line-height:1.5}
.user{align-self:flex-end;background:#000;color:#fff}
.ai{align-self:flex-start;background:#f4f4f4;border:1px solid #e5e5e5}
.inputWrap{padding:16px;max-width:800px;margin:0 auto;width:100%}
.box{background:#f4f4f4;border-radius:30px;display:flex;padding:8px 8px 8px 20px;align-items:center}
.box input{flex:1;background:transparent;border:none;outline:none;font-size:16px}
.box button{width:36px;height:36px;background:#000;color:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer}
.foot{font-size:11px;color:#999;text-align:center;padding-bottom:8px}
</style></head><body>
<div class="top">Afro AI ▼</div>
<div class="center" id="center">
<div id="welcome"><div class="logo">A</div><h1>What can I help with?</h1></div>
<div class="chat" id="chat"></div>
</div>
<div class="inputWrap">
<div class="box"><input id="msg" placeholder="Message Afro AI..." onkeypress="if(event.key=='Enter')go()"><button onclick="go()">↑</button></div>
<div class="foot">Afro AI can make mistakes. Check important info. • Made in PNG 🇵🇬</div>
</div>
<script>
function go(){
  const i=document.getElementById('msg');
  const c=document.getElementById('chat');
  const w=document.getElementById('welcome');
  const t=i.value.trim(); if(!t) return;
  if(w) w.style.display='none';
  c.innerHTML+=`<div class="bubble user">${t}</div>`;
  i.value='';
  c.innerHTML+=`<div class="bubble ai" id="temp">...</div>`;
  c.parentElement.scrollTop=99999;
  setTimeout(()=>{
    document.getElementById('temp').remove();
    let r='';
    let l=t.toLowerCase();
    if(l.includes('hello')||l.includes('hi')) r='Hello Joe! 👋 I am Afro AI, your ChatGPT clone built in PNG. How can I help you today?';
    else if(l.includes('who are you')) r='I am Afro AI, created by Joe from Blessed PNG. White ChatGPT clone for Papua New Guinea 🇵🇬';
    else if(l.includes('business')) r='I can help you with business plan! What business do you want to start?';
    else r=`You said: "${t}"\n\nI'm Afro AI - I can write, code websites, make business plans, and answer questions like ChatGPT. What do you need?`;
    c.innerHTML+=`<div class="bubble ai">${r}</div>`;
    c.parentElement.scrollTop=99999;
  },600);
}
</script></body></html>
