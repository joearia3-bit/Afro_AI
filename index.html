<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - For Kids & Beginners</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{display:flex;height:100vh;background:#f7f7f8}#side{width:260px;background:#171717;color:#fff;padding:14px;display:flex;flex-direction:column;gap:12px}@media(max-width:700px){#side{display:none}}#main{flex:1;display:flex;flex-direction:column;background:#fff}header{padding:14px 18px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center;font-weight:700}.chip{border:1px solid #ddd;background:#f5f5f5;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}#chat{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:12px;max-width:800px;width:100%;margin:0 auto}.avatar{width:32px;height:32px;border-radius:50%;background:#6d28d9;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}.bubble{line-height:1.7;white-space:pre-wrap;font-size:15px;flex:1;padding-top:4px}.user-row.bubble{background:#f4f4f4;border-radius:18px;padding:12px 16px}.bar{max-width:800px;width:100%;margin:0 auto;padding:12px 16px 18px;display:flex;gap:8px;align-items:center}.icon{width:42px;height:42px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;display:grid;place-items:center;cursor:pointer}#msg{flex:1;padding:14px 18px;border-radius:24px;border:1px solid #d1d5db;outline:none;font-size:15px}#send{width:42px;height:42px;border-radius:50%;border:none;background:#000;color:#fff;font-size:18px}#file{display:none}.welcome{text-align:center;margin:50px auto;color:#666;max-width:420px}.welcome h1{color:#000;font-size:28px;margin-bottom:10px}.badge{background:#e0f2fe;color:#0369a1;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:10px}</style></head><body>
<div id="side"><div style="font-weight:900;font-size:18px">Afro AI</div><div style="font-size:12px;opacity:.7">For Kids & Beginners<br>Built by Joe in PNG</div><button onclick="clearChat()" style="margin-top:auto;background:#2a2a2a;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer">+ New Chat</button></div>
<div id="main"><header><span>Afro AI — Made for All</span><div style="display:flex;gap:8px"><button class="chip" id="simpleBtn" onclick="toggleSimple()">🧒 Simple: ON</button><button class="chip" onclick="clearChat()">🗑️ Clear</button></div></header>
<div id="chat"><div class="welcome" id="w"><span class="badge">NEW: FOR 10 YEAR OLDS</span><h1>Afro AI</h1><p>Ask me anything! I will explain it super simple, like you are 10 years old. No big words. With examples.</p><p style="margin-top:12px;font-size:13px;background:#f4f4f4;padding:10px;border-radius:10px">Try: "What is money?" or "How does internet work?"</p></div></div>
<div class="bar"><label for="file" class="icon">📷</label><input id="file" type="file" accept="image/*"><button class="icon" id="mic">🎤</button><input id="msg" placeholder="Ask me anything simple..." onkeydown="if(event.key==='Enter')send()"><button id="send" onclick="send()">↑</button></div></div>
<script>
let chat=document.getElementById('chat'),inp=document.getElementById('msg'),fileInp=document.getElementById('file'),simpleMode=true,lastImg=null,history=JSON.parse(localStorage.getItem('afro_simple_history')||'[]');
function save(){localStorage.setItem('afro_simple_history',JSON.stringify(history))}
function renderHistory(){if(!history.length)return;document.getElementById('w')?.remove();history.forEach(m=>{let b=addRow(m.text,m.role==='user'?'user':'ai',false,true);if(m.role==='ai')b.innerText=m.text})}
function addRow(text,type,saveHist){if(document.getElementById('w'))document.getElementById('w').remove();let wrap=document.createElement('div');wrap.className='row';let av=document.createElement('div');av.className='avatar';av.innerText=type==='user'?'J':'A';let bub=document.createElement('div');bub.className='bubble';bub.innerText=text;wrap.appendChild(av);wrap.appendChild(bub);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;if(saveHist){history.push({role:type,text:text});save()}return bub}
function typeEffect(bub,full,idx){if(idx>=full.length){chat.scrollTop=chat.scrollHeight;return}bub.innerText=full.slice(0,idx+1);chat.scrollTop=chat.scrollHeight;setTimeout(()=>typeEffect(bub,full,idx+1),14)}
fileInp.onchange=()=>{let f=fileInp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{lastImg=e.target.result;let b=addRow('📷 Photo added - ask what you see','user',false);let im=document.createElement('img');im.src=lastImg;im.style.maxWidth='200px';im.style.borderRadius='12px';im.style.marginTop='8px';b.appendChild(im)};r.readAsDataURL(f)}
async function send(){let q=inp.value.trim();if(!q&&!lastImg)return;let hasImg=!!lastImg,img=lastImg;if(q)addRow(q,'user',true);else addRow('Describe this photo simply for a 10 year old','user',true);inp.value='';let aiBubble=addRow('...','ai',false);try{let prompt=q||'Describe this image in very simple words for a 10 year old child.';let system=simpleMode?"You are Afro AI built by Joe in PNG. You are a super patient teacher for a 10 year old or someone who never went to school. Rules: 1) Use very short, simple words. 2) No big words. 3) Explain with small examples from daily life in PNG village. 4) Keep answer short (3-5 short sentences). 5) Use emojis to make fun. 6) Start simple.":"You are Afro AI built by Joe in PNG. Helpful assistant.";let ans='';if(hasImg){let p={model:'openai',messages:[{role:'system',content:system},{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:img}}]}]};let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j=await r.json();ans=j.choices?.[0]?.message?.content||'Sorry I cannot see photo.'}else{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(system+' User question: '+prompt));ans=await r.text()}lastImg=null;fileInp.value='';history.push({role:'ai',text:ans.trim()});save();typeEffect(aiBubble,ans.trim(),0)}catch(e){aiBubble.innerText='Internet slow. Try again.'}}
function toggleSimple(){simpleMode=!simpleMode;let btn=document.getElementById('simpleBtn');btn.innerText=simpleMode?'🧒 Simple: ON':'🧒 Simple: OFF';btn.style.background=simpleMode?'#6d28d9':'#f5f5f5';btn.style.color=simpleMode?'#fff':'#000';}
function clearChat(){if(!confirm('Clear all?'))return;localStorage.removeItem('afro_simple_history');history=[];chat.innerHTML='<div class="welcome" id="w"><span class="badge">NEW: FOR 10 YEAR OLDS</span><h1>Afro AI</h1><p>Ask me anything! I will explain super simple.</p></div>'}
let rec,recognizing=false;document.getElementById('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Use Chrome');if(recognizing){rec.stop();return}rec=new SR();rec.lang='en-US';rec.start();recognizing=true;document.getElementById('mic').innerText='⏹️';rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()};rec.onend=()=>{recognizing=false;document.getElementById('mic').innerText='🎤'}};
renderHistory();
</script></body></html>
