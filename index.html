<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afro AI - Made for All</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="side-top">
      <h2>✨ Afro AI</h2>
      <button class="new-btn" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="side-bottom">
      <p>Made for all 🌍</p>
      <small>Built in PNG</small>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="icon" onclick="toggleSidebar()">☰</button>
      <span class="brand">Afro AI - Made for All</span>
      <button class="icon" onclick="toggleTheme()">🌙</button>
    </div>

    <div id="chatArea" class="chatArea">
      <div class="welcome">
        <div class="logo">A</div>
        <h1>Welcome to Afro AI</h1>
        <p>Your assistant — fast, light, and made for all. Ask anything!</p>
        <div class="chips">
          <button onclick="quickAsk('What can you do?')">What can you do?</button>
          <button onclick="quickAsk('Help me with PNG business ideas')">Business ideas</button>
          <button onclick="quickAsk('Explain like I am 12')">Explain topic</button>
        </div>
      </div>
    </div>

    <div class="inputWrap">
      <input id="messageInput" placeholder="Message Afro AI..." onkeydown="handleKey(event)">
      <button class="send" onclick="sendMessage()">↑</button>
    </div>
    <p class="foot">Afro AI can make mistakes. Made for all.</p>
  </div>
</div>
<script src="script.js?v=10"></script>
</body>
</html>
