<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - PNG ChatGPT</title><style>:root{--bg:#212121;--side:#171717;--border:#3d3d3d;--green:#10a37f}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:#ececec;display:flex;height:100vh;overflow:hidden}#side{width:260px;background:var(--side);display:flex;flex-direction:column;padding:12px;border-right:1px solid var(--border)}#main{flex:1;display:flex;flex-direction:column;position:relative}.new{margin:12px 0;background:var(--green);border:0;color:#fff;padding:12px;border-radius:10px;font-weight:600;cursor:pointer}#trial{margin:10px;background:#2f2f2f;border:1px solid #f59e0b;border-radius:10px;padding:10px;font-size:12px;text-align:center}#chat{flex:1;overflow:auto;padding:20px 0}#center{max-width:700px;margin:0 auto;width:100%;padding:0 16px}.msg{display:flex;gap:16px;padding:20px 16px}.msg.ai{background:#2a2a2a}.avatar{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}.user .avatar{background:#7c3aed}.ai .avatar{background:var(--green)}.text{line-height:1.6;font-size:15px;white-space:pre-wrap;flex:1}.opts{display:flex;gap:8px;margin:8px 0 16px 48px}.opts button{padding:8px 14px;border-radius:20px;border:1px solid #3d3d3d;background:#2f2f2f;color:#ececec;cursor:pointer;font-size:13px}.opts .primary{background:#fff;color:#000;font-weight:700}#bottom{padding:16px;background:var(--bg);border-top:1px solid var(--border)}#inputWrap{max-width:700px;margin:0 auto;background:#303030;border-radius:24px;display:flex;align-items:center;padding:6px 12px;border:1px solid var(--border)}#q{flex:1;background:transparent;border:0;color:#fff;outline:0;padding:10px;font-size:15px}#send{width:32px;height:32px;border-radius:50%;background:#fff;border:0;cursor:pointer;font-weight:800;color:#000}#pay{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#payBox{background:#2f2f2f;border-radius:16px;padding:24px;max-width:360px;width:100%;text-align:center}@media(max-width:768px){#side{display:none}#side.open{display:flex;position:absolute;z-index:30;left:0;top:0;height:100%}}</style></head><body><div id="side"><div style="font-weight:700;padding:12px">Afro AI PNG 🇵🇬</div><button class="new" onclick="newChat()">+ New chat</button><div id="trial"></div><div style="margin-top:auto;font-size:11px;color:#8e8ea0;padding:10px">Free 30 days • Secure QR via WhatsApp View Once</div></div><div id="main"><div style="padding:12px;display:flex;gap:12px;border-bottom:1px solid #3d3d3d;align-items:center"><span onclick="document.getElementById('side').classList.toggle('open')" style="cursor:pointer">☰</span><b>Afro AI</b><span style="background:#10a37f;padding:2px 8px;border-radius:10px;font-size:11px">ChatGPT Style</span></div><div id="chat"><div id="center"><div class="msg ai"><div class="avatar">AI</div><div class="text">Gutpla! I'm Afro AI — PNG ChatGPT 🇵🇬

FREE 30 days, then K50/year.

After each answer I'll show:
🔄 New Question or ➡️ Continue</div></div></div></div><div id="bottom"><div id="inputWrap"><input id="q" placeholder="Message Afro AI..." onkeypress="if(event.key==='Enter')ask()"><button id="send" onclick="ask()">↑</button></div></div><div id="pay"><div id="payBox"><h3>🔒 Free Trial Ended</h3><p style="color:#8e8ea0;font-size:13px;margin:12px 0">30 days finished! Unlock unlimited.</p><div style="display:flex;gap:8px;margin:16px 0"><button style="flex:1;padding:12px;background:#3d3d3d;border:0;color:#fff;border-radius:10px" onclick="sel('k25')">K25<br><span style="font-size:10px">7D</span></button><button style="flex:1;padding:12px;background:#10a37f;border:0;color:#fff;border-radius:10px" onclick="sel('k50')">K50<br><span style="font-size:10px">1 Year ⭐</span></button><button style="flex:1;padding:12px;background:#7c3aed;border:0;color:#fff;border-radius:10px" onclick="sel('k100')">K100<br><span style="font-size:10px">Life</span></button></div><input id="code" placeholder="Enter AFRO-CODE" style="width:100%;padding:12px;border-radius:10px;border:1px solid #3d3d3d;background:#212121;color:#fff"><button style="width:100%;margin-top:12px;padding:12px;background:#fff;color:#000;border:0;border-radius:10px;font-weight:700" onclick="unlock()">Unlock →</button></div></div></div><script>
let plan='k50';function sel(p){plan=p}
function newChat(){document.getElementById('center').innerHTML='<div class="msg ai"><div class="avatar">AI</div><div class="text">New chat started — Ask anything! 🇵🇬</div></div>';showOpts()}
const center=document.getElementById('center'),q=document.getElementById('q'),pay=document.getElementById('pay');
const FIRST='afro_first',PAID='afro_paid';let first=localStorage.getItem(FIRST);if(!first){first=Date.now();localStorage.setItem(FIRST,first)}
function daysLeft(){return 30-Math.floor((Date.now()-parseInt(first))/86400000)}
function checkTrial(){let paid=localStorage.getItem(PAID)==='1';if(paid){document.getElementById('trial').innerHTML='✅ Premium<br><span style="color:#10a37f">'+localStorage.getItem('afro_code')+'</span>';return true}let left=daysLeft();if(left<=0){pay.style.display='flex';document.getElementById('trial').innerHTML='❌ Trial ended';return false}else{document.getElementById('trial').innerHTML='🎁 Free Trial<br><b>'+left+' days left</b>';return true}}
function add(role,t){let m=document.createElement('div');m.className='msg '+(role==='user'?'user':'ai');m.innerHTML='<div class="avatar">'+(role==='user'?'YOU':'AI')+'</div><div class="text"></div>';m.querySelector('.text').textContent=t;center.appendChild(m);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;if(role==='ai')showOpts()}
function showOpts(){document.querySelectorAll('.opts').forEach(e=>e.remove());let o=document.createElement('div');o.className='opts';o.innerHTML='<button class="primary" onclick="doNew()">🔄 New Question</button><button onclick="doContinue()">➡️ Continue</button>';center.appendChild(o);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight}
function doNew(){document.querySelectorAll('.opts').forEach(e=>e.remove());add('user','New Question');setTimeout(()=>add('ai','Sure! What new topic? School, Farming, Business, Tok Pisin?'),300)}
function doContinue(){document.querySelectorAll('.opts').forEach(e=>e.remove());add('user','Continue');setTimeout(()=>add('ai','Ok continue — What deeper you want to know about last topic?'),300)}
function reply(t){t=t.toLowerCase();if(t.includes('tok pisin'))return 'Tok Pisin: Hello=Gude, How are you=Yu stap gut?';if(t.includes('kaukau'))return 'Kaukau: Mound 30cm, spacing 1m, harvest 4-5 months, K3-5/kg Moresby';if(t.includes('business'))return 'SME: Buy 20 flex K5=K100, sell K7=K140, profit K40/day';if(t.includes('ai'))return 'AI = Computer that learns. Afro AI is PNG version';return 'You said: "'+t+'"\nI help with school, farming, business, Tok Pisin.'}
function ask(){if(!checkTrial())return;let v=q.value.trim();if(!v)return;document.querySelectorAll('.opts').forEach(e=>e.remove());add('user',v);q.value='';setTimeout(()=>add('ai',reply(v)),400)}
function unlock(){let c=document.getElementById('code').value.trim().toUpperCase();if(c.startsWith('AFRO-')){localStorage.setItem(PAID,'1');localStorage.setItem('afro_code',c);pay.style.display='none';checkTrial();add('ai','✅ Premium unlocked! 🎉')}else alert('Invalid code')}
checkTrial();
</script></body></html>
