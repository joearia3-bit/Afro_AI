<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afro AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- SIDEBAR - like ChatGPT -->
  <div class="sidebar">
    <div class="sidebar-top">
      <button class="new-chat"><span>⊕</span> New chat</button>
      <div class="history-title">Chats</div>
      <div class="history">
        <div class="h-item">Welcome to Afro AI</div>
      </div>
    </div>
    <div class="sidebar-bottom">
      <div class="user">Joe • Free plan</div>
    </div>
  </div>

  <!-- MAIN - white ChatGPT -->
  <div class="main">
    <div class="header">
      <div class="model">Afro AI <span>▼</span></div>
    </div>

    <div id="chat" class="chat">
      <div class="welcome">
        <div class="logo">A</div>
        <h1>What can I help with?</h1>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <input id="inp" placeholder="Message Afro AI..." onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()" class="send">↑</button>
      </div>
      <div class="footer">Afro AI can make mistakes. Check important info. • Made in PNG 🇵🇬</div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
