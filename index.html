<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afro AI - ChatGPT Level</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI}body{display:flex;height:100vh;background:#f7f7f8}#side{width:260px;background:#171717;color:#fff;padding:14px;display:flex;flex-direction:column;gap:12px}@media(max-width:700px){#side{display:none}}#main{flex:1;display:flex;flex-direction:column;background:#fff}header{padding:14px 18px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center;font-weight:700}.chip{border:1px solid #ddd;background:#f5f5f5;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}#chat{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:12px;max-width:800px;width:100%;margin:0 auto}.avatar{width:32px;height:32px;border-radius:50%;background:#6d28d9;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}.bubble{line-height:1.6;white-space:pre-wrap;font-size:15px;flex:1;padding-top:4px}.user-row.bubble{background:#f4f4f4;border-radius:18px;padding:12px 16px}.ai-row.bubble{padding:12px 0}.tp{margin-top:10px;background:#f3f0ff;border-left:3px solid #6d28d9;padding:8px 12px;border-radius:8px;font-style:italic;display:none}.bar{max-width:800px;width:100%;margin:0 auto;padding:12px 16px 18px;display:flex;gap:8px;align-items:center}.icon{width:42px;height:42px;border-radius:50%;border:1px solid #e5e7eb;background:#fff;display:grid;place-items:center;cursor:pointer}#msg{flex:1;padding:14px 18px;border-radius:24px;border:1px solid #d1d5db;outline:none;font-size:15px}#send{width:42px;height:42px;border-radius:50%;border:none;background:#000;color:#fff}#file{display:none}.welcome{text-align:center;margin:60px auto;color:#666;max-width:400px}.welcome h1{color:#000;font-size:28px;margin-bottom:8px}</style></head><body>
<div id="side"><div style="font-weight:900;font-size:18px">Afro AI</div><div style="font-size:12px;opacity:.7">Made for All — PNG<br>Built by Joe</div><button onclick="clearChat()" style="margin-top:auto;background:#2a2a2a;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer">+ New Chat</button><div style="font-size:10px;opacity:.5;margin-top:10px">ChatGPT-Level v2 • Vision • Voice • Tok Pisin</div></div>
<div id="main"><header><span>Afro AI — ChatGPT Level</span><div style="display:flex;gap:8px"><button class="chip" id="tpBtn" onclick="toggleTP()">🌐 Tok Pisin: OFF</button><button class="chip" onclick="clearChat()">🗑️ Clear</button></div></header>
<div id="chat"><div class="welcome" id="w"><h1>Afro AI</h1><p>Your PNG ChatGPT — now ChatGPT level. Saves history, types like ChatGPT, sees photos, speaks Tok Pisin.</p></div></div>
<div class="bar"><label for="file" class="icon">📷</label><input id="file" type="file" accept="image/*"><button class="icon" id="mic">🎤</button><input id="msg" placeholder="Ask Afro AI anything..." onkeydown="if(event.key==='Enter')send()"><button id="send" onclick="send()">↑</button></div></div>
<script>
let chat=document.getElementById('chat'),inp=document.getElementById('msg'),fileInp=document.getElementById('file'),tpMode=false,lastImg=null,history=JSON.parse(localStorage.getItem('afro_history')||'[]');
function save(){localStorage.setItem('afro_history',JSON.stringify(history))}
function renderHistory(){if(!history.length)return;document.getElementById('w')?.remove();history.forEach(m=>{if(m.role==='user'){addRow(m.text,'user',false,true)}else{let r=addRow('','ai',false,true);typeEffect(r,m.text,0,true)}})}
function addRow(text,type,saveHist,skipAnim){if(document.getElementById('w'))document.getElementById('w').remove();let wrap=document.createElement('div');wrap.className='row '+(type==='user'?'user-row':'ai-row');let av=document.createElement('div');av.className='avatar';av.innerText=type==='user'?'J':'A';let bub=document.createElement('div');bub.className='bubble';if(type==='user'){bub.innerText=text}else{bub.innerHTML='';if(text)bub.innerText=text}let tp=document.createElement('div');tp.className='tp';bub.appendChild(tp);wrap.appendChild(av);wrap.appendChild(bub);chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;if(saveHist){history.push({role:type,text:text});save()}return bub}
function typeEffect(bub,full,idx,noSave){if(idx>=full.length){let tp=bub.querySelector('.tp');if(tpMode&&full)translateText(full,tp);return}let txt=full.slice(0,idx+1);bub.childNodes[0]&&(bub.childNodes[0].nodeType===3?bub.childNodes[0].textContent=txt:bub.innerText=txt);if(bub.querySelector('.tp')){let cur=bub.querySelector('.tp');bub.innerText=txt;bub.appendChild(cur)}else bub.innerText=txt;chat.scrollTop=chat.scrollHeight;setTimeout(()=>typeEffect(bub,full,idx+1,noSave),12)}
async function translateText(text,el){el.style.display='block';el.innerText='Translating to Tok Pisin...';try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent('Translate to natural Tok Pisin PNG Pidgin: '+text));let t=await r.text();el.innerText='🇵🇬 '+t.trim()}catch{el.innerText='Translation failed'}}
fileInp.onchange=()=>{let f=fileInp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{lastImg=e.target.result;let b=addRow('','user',false);let im=document.createElement('img');im.src=lastImg;im.style.maxWidth='200px';im.style.borderRadius='12px';im.style.marginTop='8px';b.appendChild(im)};r.readAsDataURL(f)}
async function send(){let q=inp.value.trim();if(!q&&!lastImg)return;let hasImg=!!lastImg,img=lastImg;if(q)addRow(q,'user',true);inp.value='';let aiBubble=addRow('','ai',false);let th='●●●';aiBubble.innerText=th;let prompt=q||'Describe this image';try{let ans='';if(hasImg){let p={model:'openai',messages:[{role:'system',content:'You are Afro AI, built by Joe in PNG. ChatGPT level assistant. Helpful concise.'},{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:img}}]}]};let r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j=await r.json();ans=j.choices?.[0]?.message?.content||'Could not read image.'}else{let sys='You are Afro AI built by Joe in PNG. ChatGPT level. Be helpful, concise, friendly.';let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sys+' User:'+prompt));ans=await r.text()}lastImg=null;fileInp.value='';history.push({role:'ai',text:ans.trim()});save();typeEffect(aiBubble,ans.trim(),0)}catch(e){aiBubble.innerText='Slow network. Try again: '+q}}
function toggleTP(){tpMode=!tpMode;document.getElementById('tpBtn').innerText=tpMode?'🌐 Tok Pisin: ON':'🌐 Tok Pisin: OFF';document.getElementById('tpBtn').style.background=tpMode?'#6d28d9':'#f5f5f5';document.getElementById('tpBtn').style.color=tpMode?'#fff':'#000';if(tpMode){document.querySelectorAll('.ai-row.bubble').forEach(b=>{let t=b.innerText;if(t&&!b.querySelector('.tp').innerText)translateText(t,b.querySelector('.tp'))})}else{document.querySelectorAll('.tp').forEach(e=>e.style.display='none')}}
function clearChat(){if(!confirm('Clear all chat?'))return;localStorage.removeItem('afro_history');history=[];chat.innerHTML='<div class="welcome" id="w"><h1>Afro AI</h1><p>New chat started.</p></div>'}
let rec,recognizing=false;document.getElementById('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Use Chrome for voice');if(recognizing){rec.stop();return}rec=new SR();rec.lang='en-US';rec.start();recognizing=true;document.getElementById('mic').innerText='⏹️';rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()};rec.onend=()=>{recognizing=false;document.getElementById('mic').innerText='🎤'}};
renderHistory();
</script></body></html>
